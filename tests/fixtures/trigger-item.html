<!doctype html>
<meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trigger mini verification</title>
<link rel="stylesheet" href="engine/card-deck.css"><link rel="stylesheet" href="demo/inventory.css"><link rel="stylesheet" href="studio/preview.css"><link rel="stylesheet" href="studio/playfield.css">
<style>body{margin:0;background:#20251e;color:#ddd;font:14px system-ui}nav{padding:8px}#frame{width:390px;height:844px;margin:auto;overflow:hidden}</style>
<nav><label>Frame <select id="size"><option>320×568</option><option>375×667</option><option selected>390×844</option><option>430×932</option><option>844×390</option><option>1024×768</option></select></label><button id="restart">Restart</button><label><input id="check" type="checkbox">Stat check</label><label><input id="studio" type="checkbox">Studio zoom</label><label><input id="inventory" type="checkbox">Start in inventory</label><button id="success">Show success</button><button id="failure">Show failure</button><button id="begin-swipe">Begin upward swipe</button><button id="cancel-swipe">Cancel swipe</button></nav>
<main id="frame" class="nest-playfield"><div id="preview"></div></main>
<output id="context-fade-frames" hidden></output>
<output id="mini-stroke-sample" hidden></output>
<script type="module">
import {ProjectPreview} from '../../studio/ProjectPreview.js';
import {createProject} from '../../project/model.js';
const project=createProject(),chapter=project.chapters[0],fork=chapter.nodes.find(n=>n.type==='fork');
project.itemTags=[{id:'tool',name:'PryingTool'}];
const item=project.library.find(c=>c.id==='flashlight');Object.assign(item,{tagId:'tool',name:'Prying tool',text:'A sturdy tool to lever the bolt aside.',permability:2});
const action=project.library.find(c=>c.id==='explore');Object.assign(action,{text:'Lever the bolt aside.',resolution:'direct',costs:[],effects:[]});
fork.introEnabled=false;fork.choices[0].contextItemId='tag:tool';fork.choices.push({id:'ordinary',definitionId:'explore'},{id:'checked',definitionId:'explore',overrides:{resolution:'check',check:{mode:'stat',modifierVariable:'agility',difficulty:5}}});fork.connections={'explore-choice':null,ordinary:null};
const frame=document.querySelector('#frame'),size=document.querySelector('#size'),check=document.querySelector('#check');
project.library.push({...item,id:'spare',name:'Spare tool'});
Object.assign(chapter.nodes.find(node=>node.id==='supplies'),{introEnabled:false,items:[{id:'spare-placement',definitionId:'spare'}],connections:{next:fork.id}});
const preview=new ProjectPreview(document.querySelector('#preview'),{inventoryHost:frame});
document.querySelector('#begin-swipe').onclick=()=>{preview.deck.start();preview.deck.move({axis:'y',x:0,y:-48,vx:0,vy:0});};
document.querySelector('#cancel-swipe').onclick=()=>preview.deck.cancel();
document.querySelector('#success').onclick=()=>preview.showResult({target:8,total:10,success:true});
document.querySelector('#failure').onclick=()=>preview.showResult({target:8,total:6,success:false});
frame.addEventListener('pointerdown',event=>{
  const button=event.target.closest('.nest-trigger-item>button,.nest-inventory-slot>button');
  if(!button)return;
  requestAnimationFrame(()=>{
    const style=getComputedStyle(button);
    document.querySelector('#mini-stroke-sample').textContent=JSON.stringify({
      pressed:button.getAttribute('aria-pressed'),width:style.borderTopWidth,
      color:style.borderTopColor,theme:style.getPropertyValue('--card-text').trim()});
  });
},true);
function play(){const [w,h]=size.value.split('×');frame.style.width=`${w}px`;frame.style.height=`${h}px`;action.resolution=check.checked?'check':'direct';action.check={mode:'stat',modifierVariable:'agility',difficulty:5};fork.connections=check.checked?{'explore-choice:success':null,'explore-choice:failure':null,'ordinary:success':null,'ordinary:failure':null}:{'explore-choice':null,ordinary:null};fork.connections['checked:success']=null;fork.connections['checked:failure']=null;preview.play(project,chapter.id,document.querySelector('#inventory').checked?'supplies':fork.id,{initialState:{inventory:[{...item,definitionId:item.id,remainingTriggers:2}]}});}
document.querySelector('#studio').onchange=event=>{document.documentElement.style.zoom=event.target.checked ? '.8' : '1';play();preview.deck.addEventListener('selection',traceFade);};
let traceId=0;
function traceFade(){
  const id=++traceId,start=performance.now(),samples=[];
  const sample=()=>{
    if(id!==traceId)return;
    const root=preview.actionContext.root,view=preview.actionContext.view,old=root.querySelector('.action-context-outgoing');
    samples.push({ms:Math.round(performance.now()-start),caption:preview.actionContext.caption.textContent,
      incoming:Number(getComputedStyle(view).opacity),outgoing:old?Number(getComputedStyle(old).opacity):null,
      layers:Array.from(root.querySelectorAll('.action-context-outgoing'),node=>Number(getComputedStyle(node).opacity)),
      panel:Number(getComputedStyle(root).opacity)});
    document.querySelector('#context-fade-frames').textContent=JSON.stringify(samples);
    if(performance.now()-start<240)requestAnimationFrame(sample);
  };
  requestAnimationFrame(sample);
}
size.onchange=check.onchange=document.querySelector('#inventory').onchange=document.querySelector('#restart').onclick=()=>{play();preview.deck.addEventListener('selection',traceFade);};
play();preview.deck.addEventListener('selection',traceFade);
</script>
