<!doctype html>
<meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Action availability verification</title>
<link rel="stylesheet" href="engine/card-deck.css"><link rel="stylesheet" href="demo/inventory.css"><link rel="stylesheet" href="studio/preview.css"><link rel="stylesheet" href="studio/playfield.css">
<style>body{margin:0;background:#141b1d;color:#dce3e3;font:14px system-ui}nav{display:flex;gap:18px;padding:14px;flex-wrap:wrap}#frame{width:390px;height:760px;margin:auto;overflow:hidden}select,button{font:inherit}output{display:block;padding:8px 14px}</style>
<nav><label>Availability <select id="policy"><option value="hidden">Hide unmet rules &amp; triggers</option><option value="disabled">Show unmet rules</option><option value="triggers-only">Show unmet triggers</option><option value="disabled-triggers" selected>Show unmet rules &amp; triggers</option></select></label>
<label><input id="own-item" type="checkbox">Have Lockpick</label><label><input id="exhausted" type="checkbox">Lockpick exhausted</label>
<label><input id="energy" type="checkbox">Enough energy</label><button id="restart">Restart</button></nav>
<output>Browse the cards with Left/Right. Disabled cards stay visible at normal brightness and explain their requirements below.</output>
<main id="frame" class="nest-playfield"><div id="preview"></div></main>
<script type="module">
import {ProjectPreview} from '../../studio/ProjectPreview.js';
import {createProject} from '../../project/model.js';
import {createDefinition} from '../../project/cards.js';
const project=createProject(),chapter=project.chapters[0];
const item={...createDefinition('item','lockpick'),name:'Lockpick',image:'./assets/img/flashlight.png',permability:2};
const action=(id,name,extra={})=>({...createDefinition('action',id),name,text:'Find a way through.',image:'./assets/img/corridor_02.png',...extra});
project.library=[item,action('shoot','Shoot'),action('sprint','Sprint',{costs:[{source:'variable',key:'energy',amount:5}]}),action('wait','Wait')];
chapter.startNode='fork';chapter.nodes=[{id:'fork',name:'Availability test',type:'fork',x:0,y:0,introEnabled:false,
 choices:[{id:'shoot-card',definitionId:'shoot',contextItemId:'lockpick'},{id:'sprint-card',definitionId:'sprint'},{id:'wait-card',definitionId:'wait'}],
 connections:{'shoot-card':null,'sprint-card':null,'wait-card':null}}];
const preview=new ProjectPreview(document.querySelector('#preview'),{inventoryHost:document.querySelector('#frame')});
function play(){
 project.unavailableActions=document.querySelector('#policy').value;
 preview.play(project,chapter.id,undefined,{initialState:{variables:{energy:document.querySelector('#energy').checked?7:1},
  inventory:document.querySelector('#own-item').checked?[{...item,definitionId:item.id,remainingTriggers:2}]:[]}});
 // Normal play removes an exhausted item. Also exercise an externally depleted
 // live inventory without passing an invalid zero-use item as initial state.
 if(document.querySelector('#own-item').checked&&document.querySelector('#exhausted').checked){
  preview.controller.inventory[0].remainingTriggers=0;
  preview.controller.show({restore:true});
 }
}
for(const input of document.querySelectorAll('input,select'))input.addEventListener('change',play);
document.querySelector('#restart').onclick=play;play();
</script>
