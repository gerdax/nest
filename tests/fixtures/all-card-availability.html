<!doctype html>
<meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All-card availability verification</title>
<link rel="stylesheet" href="engine/card-deck.css"><link rel="stylesheet" href="demo/inventory.css"><link rel="stylesheet" href="studio/preview.css"><link rel="stylesheet" href="studio/playfield.css">
<style>body{margin:0;background:#141b1d;color:#dce3e3;font:14px system-ui}nav{display:flex;gap:18px;padding:14px;flex-wrap:wrap}#frame{width:390px;height:760px;margin:auto;overflow:hidden}select,button{font:inherit}p{padding:0 14px}</style>
<nav><label>Card type <select id="kind"><option value="event">Vignette</option><option value="caption">Caption</option><option value="item">Item</option><option value="health">Health</option><option value="energy">Energy</option><option value="action">Action</option></select></label>
<label>Target override <select id="policy"><option value="hidden">Hide unmet rules &amp; triggers</option><option value="disabled" selected>Show unmet rules</option><option value="triggers-only">Show unmet triggers</option><option value="disabled-triggers">Show unmet rules &amp; triggers</option></select></label><button id="restart">Restart</button></nav>
<p>Choose Shoot with Arrow up. The destination has an unmet Water requirement and an unlinked exit. Show modes allow entry and display the disabled card; hide modes block Shoot.</p>
<main id="frame" class="nest-playfield"><div id="preview"></div></main>
<script type="module">
import {ProjectPreview} from './studio/ProjectPreview.js';
import {createProject} from './project/model.js';
import {createDefinition} from './project/cards.js';
const preview=new ProjectPreview(document.querySelector('#preview'),{inventoryHost:document.querySelector('#frame')});
function play(){
 const project=createProject(),chapter=project.chapters[0],kind=document.querySelector('#kind').value;
 project.unavailableActions='hidden';
 project.library=[{...createDefinition('action','shoot'),name:'Shoot',text:'Continue to the Rat.',image:'./assets/img/corridor_02.png'},
 {...createDefinition(kind,'rat'),name:'Rat',text:'Rat jumps out from the darkness.',image:'./assets/img/rat.png'},
 {...createDefinition('item','water'),name:'Water'}];
 chapter.startNode='fork';chapter.nodes=[{id:'fork',name:'Fork',type:'fork',x:0,y:0,introEnabled:false,choices:[{id:'shoot-card',definitionId:'shoot'}],connections:{'shoot-card':'target'}},
 {id:'target',name:'Linear copy',type:'linear',x:300,y:0,unavailableActions:document.querySelector('#policy').value,cards:[{id:'rat-card',definitionId:'rat',conditions:[{source:'inventory',key:'water',op:'has'}]}],connections:{next:false}}];
 preview.play(project,chapter.id);
}
for(const input of document.querySelectorAll('select'))input.addEventListener('change',play);
document.querySelector('#restart').onclick=play;play();
</script>
