<!doctype html>
<meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resource requirement icons</title>
<link rel="stylesheet" href="engine/card-deck.css"><link rel="stylesheet" href="demo/inventory.css"><link rel="stylesheet" href="studio/preview.css"><link rel="stylesheet" href="studio/playfield.css">
<style>body{margin:0;background:#141b1d;color:#dce3e3;font:14px system-ui}#frame{width:390px;height:760px;margin:auto;overflow:hidden}</style>
<main id="frame" class="nest-playfield"><div id="preview"></div></main>
<script type="module">
import {ProjectPreview} from './studio/ProjectPreview.js';
import {createProject} from './project/model.js';
import {createDefinition} from './project/cards.js';
const project=createProject(),chapter=project.chapters[0];
project.unavailableActions='disabled';project.library=[{...createDefinition('action','shoot'),name:'Shoot',text:'Fire a single round.',image:'./assets/img/corridor_02.png',costs:[{source:'variable',key:'health',amount:1},{source:'variable',key:'energy',amount:3}]}];
chapter.startNode='fork';chapter.nodes=[{id:'fork',name:'Resource test',type:'fork',x:0,y:0,introEnabled:false,choices:[{id:'shoot-card',definitionId:'shoot'}],connections:{'shoot-card':null}}];
const preview=new ProjectPreview(document.querySelector('#preview'),{inventoryHost:document.querySelector('#frame')});
preview.play(project,chapter.id,undefined,{initialState:{variables:{health:0,energy:0}}});
</script>
