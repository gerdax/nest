<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nest chapter studio</title>
  <link rel="stylesheet" href="engine/card-deck.css"><link rel="stylesheet" href="editor/editor.css"><link rel="stylesheet" href="demo/inventory.css"><link rel="stylesheet" href="studio/preview.css"><link rel="stylesheet" href="studio/editor.css"><link rel="stylesheet" href="studio/graph-connectors.css">
  <link rel="stylesheet" href="studio/playfield.css">
  <link rel="stylesheet" href="studio/definition-usage.css">
</head>
<body>
<header><div class="brand">NEST EDITOR</div><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><span class="project-name-label">Project: <span id="project-name"></span></span><span id="save-status" role="status"></span><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="undo">Undo</button><button id="redo">Redo</button><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="project-settings-toggle" aria-haspopup="dialog" aria-controls="project-settings-dialog" aria-expanded="false" title="Project settings">Project settings</button><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="export-project">Export project</button><label class="button">Import project<input id="import" type="file" accept=".json,application/json" hidden></label></header>
<nav><button id="library-view">Library</button><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="chapter-view">Chapter</button><label class="chapter-picker"><select id="chapter-selector" aria-label="Chapter"></select></label><button id="add-chapter">Add chapter</button><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="export-chapter" title="Export selected chapter">Export</button><label class="button" title="Import a chapter file">Import<input id="import-chapter" type="file" accept=".json,application/json" hidden></label><span class="spacer"></span><a href="player.html">Player ↗</a><a href="dice.html">Dice ↗</a></nav>
<nav id="node-tools"><button data-add="linear">+ Linear</button><button data-add="fork">+ Fork</button><button data-add="container">+ Container</button><button data-add="random">+ Random</button><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="copy-node" title="Copy selected beats (⌘C / Ctrl+C)">Copy</button><button id="cut-node" title="Cut selected beats (⌘X / Ctrl+X)">Cut</button><button id="paste-node" title="Paste beats into this chapter (⌘V / Ctrl+V)" disabled>Paste</button><button id="duplicate" title="Duplicate selected beats (⌘D / Ctrl+D)">Duplicate</button><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="start">Set start</button><span class="spacer"></span><label class="check-field">Autoplay:<input id="autoplay" type="checkbox" checked></label><label class="check-field">Auto card panel:<input id="auto-panel" type="checkbox" title="Toggle Auto card panel (&#92;)" aria-keyshortcuts="&#92;"></label><button id="play-node">Play selected</button><button id="play">▶ Play chapter</button></nav>

<main><section class="workspace"><div id="canvas" tabindex="0" aria-label="Chapter graph"></div><section id="library-panel" tabindex="-1" hidden><div class="library-body"><div id="library-tabs" class="library-tabs" hidden role="tablist" aria-label="Library"><button id="library-content-tab" type="button" role="tab" aria-selected="true" aria-controls="library-list">Content</button><button id="library-common-tab" type="button" role="tab" aria-selected="false" aria-controls="library-common">Common</button></div><div class="library-header"><div class="library-intro"><p class="small">Reusable definitions shared across every chapter.</p></div><div class="row library-create-buttons"><button data-add-kind="event">+ Vignette</button><button data-add-kind="caption">+ Caption</button><button data-add-kind="action">+ Action</button><button data-add-kind="item">+ Item</button><button data-add-kind="consumable">+ Consumable</button></div><div class="library-search-controls"><label class="check-field">Match selected beat type:<input id="library-match-beat" type="checkbox"></label><div class="library-search-field"><input id="library-search" type="search" aria-label="Search library" placeholder="Search names, kinds and tags"><button id="library-search-clear" type="button" aria-label="Clear search" title="Clear search" hidden>×</button></div></div></div><div id="library-list" role="tabpanel" aria-labelledby="library-content-tab"></div><div id="library-common" role="tabpanel" aria-labelledby="library-common-tab" hidden></div></div></section><div id="errors" role="status"></div></section><aside><div id="settings"></div><div class="tabs"><strong id="panel-title">Beat</strong></div><div id="inspector"></div></aside></main>
<div id="project-settings-overlay" class="project-settings-overlay" hidden><section id="project-settings-dialog" class="project-settings-dialog" role="dialog" aria-modal="true" aria-labelledby="project-settings-title" tabindex="-1"><div class="project-settings-heading"><h2 id="project-settings-title">Project settings</h2><button type="button" data-close-project-settings aria-label="Close project settings">×</button></div><div id="project-settings-content"></div></section></div>
<section id="preview-window" class="preview-window" hidden role="region" aria-label="Interaction preview"><div class="preview-window-bar"><button type="button" class="preview-window-handle" data-preview-drag aria-label="Move interaction preview" title="Drag to move · arrow keys also move this window">⠿ Interaction preview</button><button type="button" data-preview-minimize aria-label="Minimize interaction preview" aria-expanded="true" title="Minimize preview">−</button><button type="button" data-preview-close aria-label="Close interaction preview" title="Close preview (Shift+Space)" aria-keyshortcuts="Shift+Space">×</button></div><div class="preview-window-body nest-playfield"><div class="preview-window-scroll"><section id="preview"></section></div></div></section>
<script type="module" src="studio/editor.js"></script>
</body></html>
