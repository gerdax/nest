<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nest chapter studio</title>
  <link rel="stylesheet" href="engine/card-deck.css"><link rel="stylesheet" href="editor/editor.css"><link rel="stylesheet" href="demo/inventory.css"><link rel="stylesheet" href="studio/preview.css"><link rel="stylesheet" href="studio/editor.css"><link rel="stylesheet" href="studio/graph-connectors.css">
  <link rel="stylesheet" href="studio/playfield.css">
</head>
<body>
<header><div class="brand">NEST EDITOR</div><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><span class="project-name-label">Project: <span id="project-name"></span></span><span id="save-status" role="status"></span><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="undo">Undo</button><button id="redo">Redo</button><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="project-settings-toggle" aria-haspopup="dialog" aria-controls="project-settings-dialog" aria-expanded="false" title="Project settings">Project settings</button><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="export-project">Export project</button><label class="button">Import project<input id="import" type="file" accept=".json,application/json" hidden></label></header>
<nav><button id="library-view">Library</button><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="chapter-view">Chapter</button><label class="chapter-picker"><select id="chapter-selector" aria-label="Chapter"></select></label><button id="add-chapter">Add chapter</button><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="export-chapter" title="Export selected chapter">Export</button><label class="button" title="Import a chapter file">Import<input id="import-chapter" type="file" accept=".json,application/json" hidden></label><span class="spacer"></span><a href="player.html">Player ↗</a><a href="dice.html">Dice ↗</a></nav>
<nav id="node-tools"><button data-add="linear">+ Linear</button><button data-add="fork">+ Fork</button><button data-add="container">+ Container</button><button data-add="random">+ Random</button><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="copy-node" title="Copy selected beat (⌘C / Ctrl+C)">Copy</button><button id="cut-node" title="Cut selected beat (⌘X / Ctrl+X)">Cut</button><button id="paste-node" title="Paste beat into this chapter (⌘V / Ctrl+V)" disabled>Paste</button><button id="duplicate" title="Duplicate selected beat (⌘D / Ctrl+D)">Duplicate</button><span class="toolbar-divider" role="separator" aria-orientation="vertical"></span><button id="start">Set start</button><span class="spacer"></span><label class="check-field">Autoplay:<input id="autoplay" type="checkbox" checked></label><button id="play-node">Play selected</button><button id="play">▶ Play chapter</button></nav>
<main><section class="workspace"><div id="canvas" tabindex="0" aria-label="Chapter graph"></div><section id="library-panel" tabindex="-1" hidden><h1>Content library</h1><p class="small">Reusable definitions shared across every chapter.</p><div class="row"><button data-add-kind="event">New vignette</button><button data-add-kind="caption">New caption</button><button data-add-kind="action">New action</button><button data-add-kind="item">New item</button><button data-add-kind="health">New health</button><button data-add-kind="energy">New energy</button></div><button id="cleanup-local" type="button" title="Remove unused local cards; shared library cards are preserved">Clean unused local cards</button><div class="library-search-controls"><input id="library-search" aria-label="Search library" placeholder="Search names and kinds"><label class="check-field"><input id="library-match-beat" type="checkbox">Match selected beat</label></div><div id="library-list"></div></section><div id="errors" role="status"></div></section><aside><div id="settings"></div><div class="tabs"><strong id="panel-title">Beat</strong></div><div id="inspector"></div></aside></main>
<div id="project-settings-overlay" class="project-settings-overlay" hidden><section id="project-settings-dialog" class="project-settings-dialog" role="dialog" aria-modal="true" aria-labelledby="project-settings-title" tabindex="-1"><div class="project-settings-heading"><h2 id="project-settings-title">Project settings</h2><button type="button" data-close-project-settings aria-label="Close project settings">×</button></div><div id="project-settings-content"></div></section></div>
<section id="preview-window" class="preview-window" hidden role="region" aria-label="Interaction preview"><div class="preview-window-bar"><button type="button" class="preview-window-handle" data-preview-drag aria-label="Move interaction preview" title="Drag to move · arrow keys also move this window">⠿ Interaction preview</button><button type="button" data-preview-minimize aria-label="Minimize interaction preview" aria-expanded="true" title="Minimize preview">−</button><button type="button" data-preview-close aria-label="Close interaction preview" title="Close preview">×</button></div><div class="preview-window-body nest-playfield"><div class="preview-window-scroll"><section id="preview"></section></div></div></section>
<script type="module" src="studio/editor.js"></script>
</body></html>
