<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nest chapter studio</title>
  <link rel="stylesheet" href="engine/card-deck.css"><link rel="stylesheet" href="editor/editor.css"><link rel="stylesheet" href="demo/inventory.css"><link rel="stylesheet" href="studio/preview.css"><link rel="stylesheet" href="studio/editor.css"><link rel="stylesheet" href="studio/graph-connectors.css">
</head>
<body>
<header><a href="player.html" class="brand">NEST <span>Chapter studio</span></a><strong id="project-name"></strong><span id="save-status" role="status"></span><button id="undo">Undo</button><button id="redo">Redo</button><button id="export-project">Export project</button><button id="export-chapter">Export chapter</button><label class="button">Import JSON<input id="import" type="file" accept=".json,application/json" hidden></label><a href="player.html">Player ↗</a><a href="dice.html">Dice ↗</a></header>
<nav><button id="chapter-view">Chapter</button><button id="library-view">Library</button><label class="chapter-picker">Chapter<select id="chapter-selector" aria-label="Chapter"></select></label><button id="add-chapter">Add chapter</button><span class="spacer"></span><button id="show-preview">Preview</button><button id="play">▶ Play chapter</button><button id="play-node">Play selected</button><label class="check-field"><input id="autoplay" type="checkbox" checked>Autoplay</label><button id="restart">Restart</button><button id="stop">Stop</button></nav>
<nav id="node-tools"><button data-add="linear">+ Linear</button><button data-add="fork">+ Fork</button><button data-add="container">+ Container</button><button data-add="random">+ Random</button><button id="duplicate">Duplicate</button><button id="delete">Delete node</button><button id="start">Set start</button><button id="fit">Fit canvas</button></nav>
<main><section class="workspace"><div id="canvas" tabindex="0" aria-label="Chapter graph"></div><section id="library-panel" hidden><h1>Content library</h1><p class="small">Reusable definitions shared across every chapter.</p><div class="row"><button data-add-kind="event">New beat</button><button data-add-kind="caption">New caption</button><button data-add-kind="action">New action</button><button data-add-kind="item">New item</button></div><button id="cleanup-local" type="button" title="Remove unused local cards; shared library cards are preserved">Clean unused local cards</button><input id="library-search" aria-label="Search library" placeholder="Search names and kinds"><div id="library-list"></div></section><div id="errors" role="status"></div></section><aside><div id="settings"></div><div class="tabs"><strong>Inspector</strong><span id="selected-type"></span></div><div id="inspector"></div></aside></main>
<section id="preview-window" class="preview-window" hidden role="region" aria-label="Interaction preview"><div class="preview-window-bar"><button type="button" class="preview-window-handle" data-preview-drag aria-label="Move interaction preview" title="Drag to move · arrow keys also move this window">⠿ Interaction preview</button><button type="button" data-preview-minimize aria-label="Minimize interaction preview" aria-expanded="true" title="Minimize preview">−</button><button type="button" data-preview-close aria-label="Close interaction preview" title="Close preview">×</button></div><div class="preview-window-body"><section id="preview"></section></div></section>
<script type="module" src="studio/editor.js"></script>
</body></html>
