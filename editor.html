<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nest chapter editor</title><link rel="stylesheet" href="engine/card-deck.css"><link rel="stylesheet" href="editor/editor.css"><link rel="stylesheet" href="./demo/inventory.css?v=grab-camera-1"></head>
<body><header><a href="index.html" class="brand">NEST <span>Chapter studio</span></a><input id="chapter-name" aria-label="Chapter name"><span id="save-status"></span><button id="undo">Undo</button><button id="redo">Redo</button><button id="export">Export JSON</button><label class="button">Import JSON<input id="import" type="file" accept=".json,application/json" hidden></label><a href="player.html">Player ↗</a></header>
<nav><button data-add="linear">+ Linear</button><button data-add="forked">+ Forked</button><button data-add="container">+ Container</button><button data-add="random">+ Random</button><button id="duplicate">Duplicate</button><button id="delete">Delete</button><button id="start">Set start</button><span class="spacer"></span><button id="fit">Fit canvas</button><button id="play">▶ Play chapter</button><button id="play-node">Play selected</button><button id="restart">Restart</button><button id="stop">Stop</button></nav>
<main><section class="workspace"><div id="canvas" tabindex="0" aria-label="Chapter graph"><div id="world"><svg id="edges"></svg><div id="nodes"></div></div></div><div class="canvas-help">Drag nodes · Drag background to pan · Scroll to zoom · Click an exit, then a node to connect</div><div id="errors" role="status"></div></section><aside><details id="chapter-settings" class="chapter-settings"><summary>Chapter settings</summary><div id="chapter-settings-fields"></div></details><div class="tabs"><strong>Inspector</strong><span id="selected-type"></span></div><div id="inspector"></div><section id="preview"></section></aside></main><script type="module" src="editor/editor.js"></script></body></html>
