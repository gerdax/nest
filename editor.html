<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nest chapter studio</title>
  <link rel="stylesheet" href="engine/card-deck.css"><link rel="stylesheet" href="editor/editor.css"><link rel="stylesheet" href="demo/inventory.css"><link rel="stylesheet" href="studio/preview.css"><link rel="stylesheet" href="studio/editor.css">
</head>
<body>
<header><a href="player.html" class="brand">NEST <span>Chapter studio</span></a><strong id="project-name"></strong><span id="save-status" role="status"></span><button id="undo">Undo</button><button id="redo">Redo</button><button id="export-project">Export project</button><button id="export-chapter">Export chapter</button><label class="button">Import JSON<input id="import" type="file" accept=".json,application/json" hidden></label><a href="player.html">Player ↗</a><a href="dice.html">Dice ↗</a></header>
<nav><button id="chapter-view">Chapter</button><button id="library-view">Library</button><label class="chapter-picker">Chapter<select id="chapter-selector" aria-label="Chapter"></select></label><button id="add-chapter">Add chapter</button><span class="spacer"></span><button id="play">▶ Play chapter</button><button id="play-node">Play selected</button><button id="restart">Restart</button><button id="stop">Stop</button></nav>
<nav id="node-tools"><button data-add="linear">+ Linear</button><button data-add="fork">+ Fork</button><button data-add="container">+ Container</button><button data-add="random">+ Random</button><button id="duplicate">Duplicate</button><button id="delete">Delete node</button><button id="start">Set start</button><button id="fit">Fit canvas</button></nav>
<main><section class="workspace"><div id="canvas" tabindex="0" aria-label="Chapter graph"></div><section id="library-panel" hidden><h1>Content library</h1><p class="small">Reusable definitions shared across every chapter.</p><div class="row"><button data-add-kind="narrative">New narrative</button><button data-add-kind="action">New action</button><button data-add-kind="item">New item</button></div><input id="library-search" aria-label="Search library" placeholder="Search names and kinds"><div id="library-list"></div></section><div id="errors" role="status"></div></section><aside><div id="settings"></div><div class="tabs"><strong>Inspector</strong><span id="selected-type"></span></div><div id="inspector"></div><section id="preview"></section></aside></main>
<script type="module" src="studio/editor.js"></script>
</body></html>
