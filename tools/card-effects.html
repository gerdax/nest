<!doctype html>
<meta charset="utf-8">
<title>Card effect raster sources</title>
<style>
/* Preserved CSS sources, rendered on transparency at 2x by render-card-effects.mjs.
   Reference card: 300 x 400 CSS px; corner radius: 20px. */
html,body {margin:0;background:transparent;}
.capture {position:relative;width:428px;height:528px;}
.card {position:absolute;left:64px;top:64px;width:300px;height:400px;border-radius:20px;box-sizing:border-box;}
/* Bake the shadow's interior too: scaling an outer-only box-shadow would
   expose a transparent hole. Blur is applied offline, never in the player. */
#shadow .card {background:#000b;filter:blur(9px);translate:0 8px;}
#edge .card {box-shadow:0 1px 0 #46493b,0 2px 0 #303329,0 3px 0 #202319,0 4px 1px #10130ed9;}
#rim {width:300px;height:400px;}
#rim .card {inset:0;box-shadow:inset 0 1px 2px #d7d1b02e,inset 0 -2px 3px #0009;}
#rim .card::before {content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(165deg,#d5ceb047 0%,#a9aa8624 18%,#777d5813 42%,#282c1c66 72%,#070b0673 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;}
</style>
<div id="shadow" class="capture"><div class="card"></div></div>
<div id="edge" class="capture"><div class="card"></div></div>
<div id="rim" class="capture"><div class="card"></div></div>
